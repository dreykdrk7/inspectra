name: Release candidate artifacts

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character main commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build reproducible prerelease artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Bind build to the reviewed main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_SHA}" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(cat VERSION)" == "0.3.0-beta.1" ]]
          test -z "$(git status --porcelain)"
      - name: Install pinned build tooling
        run: python -m pip install -r cli/requirements-build.lock
      - name: Build and compare independent distributions
        run: python cli/scripts/build_release.py --output release-dist
      - name: Verify inventory, checksums and CycloneDX document
        run: |
          set -euo pipefail
          (cd release-dist && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("release-dist")
          expected = {
              "SHA256SUMS",
              "inspectra-cli-0.3.0b1.sbom.cdx.json",
              "inspectra_cli-0.3.0b1-py3-none-any.whl",
              "inspectra_cli-0.3.0b1.tar.gz",
          }
          observed = {path.name for path in root.iterdir() if path.is_file()}
          if observed != expected:
              raise SystemExit(f"Unexpected release inventory: {sorted(observed)}")
          sbom = json.loads((root / "inspectra-cli-0.3.0b1.sbom.cdx.json").read_text())
          component = sbom.get("metadata", {}).get("component", {})
          if sbom.get("bomFormat") != "CycloneDX" or sbom.get("specVersion") != "1.6":
              raise SystemExit("The release SBOM is not the required CycloneDX 1.6 document.")
          if component.get("name") != "inspectra-cli" or component.get("version") != "0.3.0b1":
              raise SystemExit("The release SBOM identity does not match the candidate.")
          PY
      - name: Install both distributions without runtime dependencies
        run: |
          set -euo pipefail
          python -m venv /tmp/inspectra-wheel
          /tmp/inspectra-wheel/bin/python -m pip install --no-deps release-dist/*.whl
          test "$(/tmp/inspectra-wheel/bin/inspectra --version)" = "0.3.0-beta.1"
          /tmp/inspectra-wheel/bin/inspectra --help >/dev/null
          python -m venv /tmp/inspectra-sdist
          /tmp/inspectra-sdist/bin/python -m pip install -r cli/requirements-build.lock
          /tmp/inspectra-sdist/bin/python -m pip install --no-deps --no-build-isolation release-dist/*.tar.gz
          test "$(/tmp/inspectra-sdist/bin/inspectra --version)" = "0.3.0-beta.1"
          /tmp/inspectra-sdist/bin/inspectra --help >/dev/null
      - name: Scan packaged material with Gitleaks
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --config /repo/.gitleaks.toml --redact=100 --exit-code 1 --max-archive-depth 2 /repo/release-dist
      - name: Upload temporary candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inspectra-0.3.0-beta.1-${{ github.sha }}
          path: release-dist/*
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 1
