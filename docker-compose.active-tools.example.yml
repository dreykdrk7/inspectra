# Standalone review example for the isolated active-tools service. All network
# capabilities remain disabled unless an operator explicitly enables each one.

name: inspectra-active-tools-example

services:
  active-tools:
    profiles: ["active"]
    image: inspectra-active-tools:asgi-smoke
    build:
      context: .
      dockerfile: docker/active-tools/Dockerfile
    command: ["python", "-m", "uvicorn", "active_runner.app:app", "--host", "0.0.0.0", "--port", "8080"]
    container_name: inspectra-active-tools
    environment:
      INSPECTRA_ACTIVE_TOOLS_NMAP_BASIC_EXECUTION_ENABLED: "false"
      INSPECTRA_ACTIVE_TOOLS_DNS_INVENTORY_EXECUTION_ENABLED: "false"
      INSPECTRA_ACTIVE_TOOLS_DNS_OSINT_EXECUTION_ENABLED: "false"
      INSPECTRA_ACTIVE_TOOLS_HTTP_HEADERS_EXECUTION_ENABLED: "false"
      INSPECTRA_ACTIVE_TOOLS_TLS_BASIC_EXECUTION_ENABLED: "false"
      INSPECTRA_ACTIVE_TOOLS_ASSET_VERIFICATION_EXECUTION_ENABLED: "false"
    networks:
      - inspectra_internal
      - inspectra_active_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  inspectra_internal:
    internal: true
  inspectra_active_egress:
